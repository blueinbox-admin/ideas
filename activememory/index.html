<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Memory — Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1f6b54;
    --green-deep: #16513f;
    --green-tint: #f1f6f3;
    --green-line: #d9e7e0;
    --ink: #1b211e;
    --muted: #707873;
    --faint: #a3aaa5;
    --line: #ebedeb;
    --line-soft: #f2f3f2;
    --bg: #fbfcfb;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .col { display: flex; flex-direction: column; height: 100%; }

  /* ============ LEFT: structured profile form ============ */
  .profile {
    width: 56%;
    background: #fff;
    border-right: 1px solid var(--line);
  }
  .p-head {
    flex: 0 0 auto;
    padding: 24px 36px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .p-head h1 {
    font-size: 18px; font-weight: 600; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .p-head h1 .mark {
    width: 24px; height: 24px; border-radius: 6px; background: var(--green);
    display: grid; place-items: center; color: #fff; font-size: 13px;
  }
  .saved-state { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .saved-state .tick { color: var(--green); font-weight: 700; }

  .p-body { flex: 1; overflow-y: auto; padding: 6px 36px 30px; }

  .fieldset { padding: 22px 0 6px; }
  .fieldset + .fieldset { border-top: 1px solid var(--line-soft); }
  .legend {
    font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; margin-bottom: 16px;
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 4px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .field label .new { margin-left: 7px; font-size: 10px; font-weight: 600; color: var(--green); background: var(--green-tint); border: 1px solid var(--green-line); padding: 1px 7px; border-radius: 20px; }
  .input, .textarea {
    width: 100%; font: inherit; font-size: 14px; color: var(--ink); line-height: 1.5;
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    background: #fff; transition: border-color .12s, box-shadow .12s, background .12s;
  }
  .textarea { resize: vertical; min-height: 44px; }
  .input:focus, .textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
  .field.dirty .input, .field.dirty .textarea { background: #fffdf6; border-color: #e7d7a8; }
  .row2 { display: flex; gap: 14px; }
  .row2 .field { flex: 1; }

  /* sticky save bar */
  .save-bar {
    flex: 0 0 auto; border-top: 1px solid var(--line);
    padding: 14px 36px; background: #fff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .save-bar .hint { font-size: 12.5px; color: var(--faint); }
  .save-bar .hint.show-dirty { color: #a07c1f; }
  .btn { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 20px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; transition: background .12s, color .12s, opacity .12s; }
  .btn-save { background: var(--green); color: #fff; }
  .btn-save:hover { background: var(--green-deep); }
  .btn-save:disabled { opacity: .45; cursor: default; }
  .btn-save.done { background: var(--green-deep); }

  /* ============ RIGHT: question queue ============ */
  .queue { width: 44%; background: var(--bg); }
  .q-head { flex: 0 0 auto; padding: 24px 28px 16px; border-bottom: 1px solid var(--line); }
  .q-head .top { display: flex; align-items: center; justify-content: space-between; }
  .q-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .synced { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .live { width: 7px; height: 7px; border-radius: 50%; background: #2bbd7e; box-shadow: 0 0 0 0 rgba(43,189,126,0.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(43,189,126,0.5);} 70% { box-shadow: 0 0 0 6px rgba(43,189,126,0);} 100% { box-shadow: 0 0 0 0 rgba(43,189,126,0);} }
  .q-head .note { margin-top: 6px; font-size: 12.5px; color: var(--faint); }

  .q-body { flex: 1; overflow-y: auto; padding: 14px 28px 40px; }

  .q { padding: 18px 0 20px; transition: opacity .4s ease, transform .4s ease, max-height .45s ease, padding .45s ease; max-height: 340px; overflow: hidden; }
  .q + .q { border-top: 1px solid var(--line); }
  .q.enter { opacity: 0; transform: translateY(-8px); max-height: 0; padding-top: 0; padding-bottom: 0; }
  .q.gone { opacity: 0; transform: translateX(12px); max-height: 0; padding-top: 0; padding-bottom: 0; }

  /* typing cue while "Claude works" */
  .typing { display: flex; align-items: center; gap: 8px; padding: 16px 0 4px; font-size: 12.5px; color: var(--faint); opacity: 0; transition: opacity .25s; }
  .typing.show { opacity: 1; }
  .typing .pips { display: inline-flex; gap: 3px; }
  .typing .pips i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); opacity: .35; animation: pip 1.1s infinite; }
  .typing .pips i:nth-child(2) { animation-delay: .18s; }
  .typing .pips i:nth-child(3) { animation-delay: .36s; }
  @keyframes pip { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .q .meta { font-size: 11px; letter-spacing: 0.04em; color: var(--faint); display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
  .q .meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: 0 0 auto; }
  .q.catch .meta .dot { background: #cf9b34; }
  .q .ask { font-size: 14.5px; line-height: 1.5; color: var(--ink); margin-bottom: 14px; }
  .q .ask b { font-weight: 600; }
  .answer { width: 100%; font: inherit; font-size: 13.5px; color: var(--ink); line-height: 1.45; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; resize: none; background: #fff; margin-bottom: 12px; }
  .answer::placeholder { color: var(--faint); }
  .answer:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
  .actions { display: flex; align-items: center; gap: 10px; }
  .btn-skip { background: transparent; color: var(--muted); border: none; padding: 9px 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-skip:hover { color: var(--ink); }
  .yesno { display: flex; gap: 8px; }
  .chip { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); transition: background .12s, border-color .12s, color .12s; }
  .chip:hover { border-color: var(--green); background: var(--green-tint); color: var(--green-deep); }
  .empty { font-size: 12.5px; color: var(--faint); padding: 18px 0 0; text-align: center; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,130,125,0.28); border-radius: 6px; }
</style>
</head>
<body>

  <!-- ===================== LEFT: STRUCTURED PROFILE FORM ===================== -->
  <div class="col profile">
    <div class="p-head">
      <h1><span class="mark">◧</span> Business profile</h1>
      <div class="saved-state" id="savedState"><span class="tick">✓</span> All changes saved</div>
    </div>

    <div class="p-body" id="formBody">

      <div class="fieldset">
        <div class="legend">Basics</div>
        <div class="field">
          <label>Business name</label>
          <input class="input" value="Diskint Law">
        </div>
        <div class="row2">
          <div class="field">
            <label>Website</label>
            <input class="input" value="diskintlaw.com">
          </div>
          <div class="field">
            <label>Industry</label>
            <input class="input" value="Estate planning law firm">
          </div>
        </div>
        <div class="field">
          <label>One-line description</label>
          <input class="input" value="Flat-fee estate planning for families in California and Nevada.">
        </div>
      </div>

      <div class="fieldset">
        <div class="legend">Practice</div>
        <div class="row2">
          <div class="field">
            <label>Locations served</label>
            <input class="input" value="California, Nevada">
          </div>
          <div class="field">
            <label>Pricing model</label>
            <input class="input" value="Flat fee, quoted up front">
          </div>
        </div>
        <div class="field">
          <label>Services offered</label>
          <input class="input" value="Wills, trusts, estate plans, probate">
        </div>
        <div class="field">
          <label>Services we do NOT offer</label>
          <input class="input" value="Family law, criminal defense">
        </div>
      </div>

      <div class="fieldset">
        <div class="legend">Voice &amp; tone</div>
        <div class="field">
          <label>How we sound</label>
          <textarea class="textarea" rows="2">Plain English, no legal jargon. Warm and clear. Clients are everyday people, not lawyers.</textarea>
        </div>
        <div class="field">
          <label>Words to never use <span class="new">updated just now</span></label>
          <input class="input" value="cheap, affordable, discount, budget">
        </div>
        <div class="field">
          <label>Positioning</label>
          <input class="input" value="Not the discount firm. We compete on clarity and quality.">
        </div>
      </div>

      <div class="fieldset">
        <div class="legend">Compliance</div>
        <div class="field">
          <label>Rules that apply to all copy</label>
          <textarea class="textarea" rows="2">No superlatives or guarantees (state bar advertising rules). Every page ends with the "not legal advice" disclaimer.</textarea>
        </div>
      </div>

      <div class="fieldset">
        <div class="legend">Getting clients</div>
        <div class="row2">
          <div class="field">
            <label>Call to action</label>
            <input class="input" value="Book a free 15-minute consult">
          </div>
          <div class="field">
            <label>Booking link</label>
            <input class="input" value="calendly.com/diskintlaw">
          </div>
        </div>
        <div class="field">
          <label>Clients we want more of</label>
          <input class="input" placeholder="Not set yet. A question on the right can fill this in.">
        </div>
      </div>

    </div>

    <div class="save-bar">
      <div class="hint" id="saveHint">Edit any field to update what Claude knows.</div>
      <button class="btn btn-save" id="saveBtn" disabled>Save changes</button>
    </div>
  </div>

  <!-- ===================== RIGHT: QUESTION QUEUE ===================== -->
  <div class="col queue">
    <div class="q-head">
      <div class="top">
        <h2>Questions</h2>
        <div class="synced"><span class="live"></span> Live with Claude Code</div>
      </div>
      <div class="note" id="qNote">Claude is working next door. Questions show up as it goes.</div>
    </div>
    <div class="q-body" id="qBody">
      <div class="empty" id="emptyMsg" style="display:none;">All caught up. Nice.</div>
    </div>
  </div>

<script>
  // ---- Left form: dirty tracking + save feedback (no real persistence) ----
  var body = document.getElementById('formBody');
  var saveBtn = document.getElementById('saveBtn');
  var saveHint = document.getElementById('saveHint');
  var savedState = document.getElementById('savedState');
  var dirty = false;

  function markDirty(e) {
    var field = e.target.closest('.field');
    if (field) field.classList.add('dirty');
    if (dirty) return;
    dirty = true;
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save changes';
    saveBtn.classList.remove('done');
    saveHint.textContent = 'You have unsaved changes.';
    saveHint.classList.add('show-dirty');
    savedState.style.visibility = 'hidden';
  }
  body.addEventListener('input', markDirty);

  saveBtn.addEventListener('click', function () {
    if (!dirty) return;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    setTimeout(function () {
      document.querySelectorAll('.field.dirty').forEach(function (f) { f.classList.remove('dirty'); });
      saveBtn.textContent = 'Saved ✓';
      saveBtn.classList.add('done');
      saveHint.textContent = 'Synced to Claude. It will use this on your next message.';
      saveHint.classList.remove('show-dirty');
      savedState.style.visibility = 'visible';
      dirty = false;
      setTimeout(function () {
        saveBtn.textContent = 'Save changes';
        saveBtn.classList.remove('done');
        saveBtn.disabled = true;
        saveHint.textContent = 'Edit any field to update what Claude knows.';
      }, 1800);
    }, 550);
  });

  // ---- Right queue: preset questions fade in over time, as if Claude is working next door ----
  var qBody = document.getElementById('qBody');
  var emptyMsg = document.getElementById('emptyMsg');

  var PRESETS = [
    { meta: 'Caught from your last edit', catch: false,
      ask: 'You told Claude to drop "affordable." Should that be a permanent rule for all your copy?',
      ph: 'e.g. yes, never use it on any page...' },
    { meta: 'Claude assumed something', catch: true,
      ask: 'The new page reads like you serve clients anywhere. You only practice in <b>California and Nevada</b>, right?',
      ph: 'e.g. yes, CA and NV only...' },
    { meta: 'Would sharpen your content', catch: false,
      ask: 'Are there clients you want more of right now? It changes how Claude writes your pages.',
      ph: 'e.g. business owners setting up trusts...' },
    { meta: 'Claude is unsure', catch: true,
      ask: 'Claude wrote "call our office today." Do you take phone calls, or should everything go through the booking link?',
      ph: 'e.g. booking link only, we do not list a phone number...' },
    { meta: 'Worth pinning down', catch: false,
      ask: 'Your trust page and will page use a different tone. Which one sounds more like you?',
      ph: 'e.g. the will page, keep it that warm...' },
    { meta: 'Gap Claude noticed', catch: false,
      ask: 'There is no contact info for after-hours questions. Is there one, or do you want every page to say consults are by appointment?',
      ph: 'e.g. by appointment only...' }
  ];

  function checkEmpty() {
    var left = qBody.querySelectorAll('.q:not(.gone)').length;
    emptyMsg.style.display = left ? 'none' : 'block';
  }

  function buildQuestion(p) {
    var q = document.createElement('div');
    q.className = 'q enter' + (p.catch ? ' catch' : '');
    q.innerHTML =
      '<div class="meta"><span class="dot"></span> ' + p.meta + '</div>' +
      '<div class="ask">' + p.ask + '</div>' +
      '<textarea class="answer" rows="2" placeholder="' + p.ph + '"></textarea>' +
      '<div class="actions">' +
        '<button class="btn btn-save" data-q>Save</button>' +
        '<button class="btn-skip" data-q>Skip</button>' +
      '</div>';
    return q;
  }

  // typing cue element
  var typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = 'Claude is working <span class="pips"><i></i><i></i><i></i></span>';
  qBody.insertBefore(typing, emptyMsg);

  function addQuestion(p) {
    var q = buildQuestion(p);
    qBody.insertBefore(q, qBody.firstChild); // newest on top
    // force reflow then animate in
    void q.offsetHeight;
    q.classList.remove('enter');
    checkEmpty();
  }

  var idx = 0;
  function tick() {
    if (idx >= PRESETS.length) return;
    typing.classList.add('show');
    setTimeout(function () {
      typing.classList.remove('show');
      addQuestion(PRESETS[idx]);
      idx++;
      if (idx < PRESETS.length) setTimeout(tick, 4200 + Math.round((idx % 3) * 700));
    }, 1100);
  }
  setTimeout(tick, 700);

  // answering / skipping removes the question (event delegation for dynamic nodes)
  qBody.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-q]');
    if (!btn) return;
    var q = btn.closest('.q');
    q.classList.add('gone');
    setTimeout(checkEmpty, 420);
  });
</script>

</body>
</html>
